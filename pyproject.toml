[project]
name = "cloud-sentinel"
version = "0.1.0"
description = "Autonomous CSPM Environment for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "openenv-core>=0.2.0",  # Added this for the validator
]

[project.scripts]
# Changed from :app to :main as requested by the validator
server = "src.envs.cloud_audit.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"