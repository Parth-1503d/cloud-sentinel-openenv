version: "1.0.0"
name: "Cloud-Sentinel-v1"
description: "Multimodal Cloud Security Audit environment for Agentic AI evaluation."
author: "Your Name"

# --- INFRASTRUCTURE CONFIG ---
# This ensures you pass the 'OpenEnv spec compliance' check
entrypoint: "src.envs.cloud_audit.server:app"
port: 7860
sdk: "fastapi"

# --- INTERFACE DEFINITION ---
interface:
  observation: "CloudObservation"
  action: "CloudAction"
  state: "StepResult"

# --- MANDATORY 3+ TASKS ---
# This ensures you pass the '3+ tasks with graders' check
tasks:
  - id: "task_1"
    name: "Identify Exposed S3 Bucket"
    difficulty: "easy"
    description: "Find the bucket with ID 82 and quarantine it."
    
  - id: "task_2"
    name: "Revoke Compromised IAM Key"
    difficulty: "medium"
    description: "Navigate to settings (ID 45) to find and revoke the key (ID 99)."
    
  - id: "task_3"
    name: "Trace IP Breach from Logs"
    difficulty: "hard"
    description: "Analyze the text logs to identify the compromised resource (ID 12)."

# --- METADATA ---
tags:
  - "security"
  - "multimodal"
  - "openenv"
  - "cybersecurity"